<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Skill</title>


    <style>

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

        }


        .container {

            width: 450px;

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.25);

        }


        h1 {

            text-align: center;

            color: #4a148c;

            margin-bottom: 10px;

        }


        .welcome {

            text-align: center;

            color: #666;

            margin-bottom: 30px;

        }


        label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;

            color: #333;

        }


        input {

            width: 100%;

            padding: 12px;

            box-sizing: border-box;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 15px;

            margin-bottom: 20px;

        }


        input:focus {

            outline: none;

            border-color: #6a1b9a;

        }


        .button {

            display: inline-block;

            padding: 11px 18px;

            border: none;

            border-radius: 7px;

            background: #6a1b9a;

            color: white;

            text-decoration: none;

            font-weight: bold;

            cursor: pointer;

        }


        .button:hover {

            background: #4a148c;

        }


        .cancel {

            background: #757575;

            margin-left: 8px;

        }


        .cancel:hover {

            background: #424242;

        }

    </style>

</head>


<body>


<div class="container">


    <h1>
        ✏️ Edit Skill
    </h1>


    <p class="welcome">

        Welcome, {{ admin_name }} 👋

    </p>


    <form
        action="/admin/skills/edit/{{ skill.id }}"
        method="POST"
    >


        <label for="skill_name">

            Skill Name

        </label>


        <input
            type="text"
            id="skill_name"
            name="skill_name"
            value="{{ skill.skill_name }}"
            required
        >


        <button
            type="submit"
            class="button"
        >

            💾 Save Changes

        </button>


        <a
            href="/admin/skills"
            class="button cancel"
        >

            ❌ Cancel

        </a>


    </form>


</div>


</body>

</html>
